name: Release

# 触发方式：
#   1. 仓库 Actions 页面 -> 选 Release workflow -> Run workflow（手工触发，测试用，
#      无需任何 git tag；构建产物为绿色版 exe，放到 Draft release 附件里）
#   2. 推送形如 v0.1.0 的 git tag（正式发版，推荐）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 仅构建 release 二进制（--no-bundle：跳过 MSI/NSIS 打包，规避国内 WiX
      # 下载超时；前端 dist 仍会嵌入 exe）。以后要恢复安装包：去掉 --no-bundle，
      # 并把下方上传步骤换成 tauri-apps/tauri-action。
      - name: Build release (portable exe only)
        run: npm run tauri build -- --no-bundle

      # 手工创建 draft release 并上传绿色版 exe（tauri-action 强制要求 bundle
      # 产物，--no-bundle 下会报 "No artifacts were found"，故不用它）。
      # 推 tag 时用 tag 名；手工触发时用 manual-<run_number>，不污染 tag 列表。
      - name: Create draft release & upload portable exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            ## DiskLens ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}

            Windows 磁盘占用分析器。附件为**绿色版可执行文件**（免安装，双击即用）：

            - **`disk-lens.exe`** — 绿色版单文件（Windows 10/11 + WebView2 Runtime，Win11 自带）
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}"
          TITLE="DiskLens ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}"
          gh release create "$TAG" \
            src-tauri/target/release/disk-lens.exe \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --draft
          echo "created release $TAG with disk-lens.exe"
