name: Release

# 触发方式：
#   1. 仓库 Actions 页面 -> 选 Release workflow -> Run workflow（手工触发，测试用，
#      无需任何 git tag；构建产物为绿色版 exe，放到 Draft release 附件里）
#   2. 推送形如 v0.1.0 的 git tag（正式发版，推荐）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri build 会：npm run build（前端）-> cargo build --release（后端）。
      # 当前阶段 --no-bundle：跳过 MSI/NSIS 安装包（国内拉 WiX 易超时），只产绿色版 exe。
      # 以后要恢复安装包：删掉下面 `args: --no-bundle` 这一行即可。
      - name: Build & create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 推 tag 时用 tag 名；手工触发时用 manual-<run_number>，避免污染 tag 列表
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          releaseName: DiskLens ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          releaseBody: |
            ## DiskLens

            Windows 磁盘占用分析器。从下方附件下载**绿色版可执行文件**（免安装，双击即用）：

            - **`disk-lens.exe`** — 绿色版单文件（Windows 10/11 + WebView2 Runtime，Win11 自带）

            > 当前为测试构建，仅发布绿色版 exe；正式版将同时提供 MSI/NSIS 安装包。
          releaseDraft: true
          prerelease: false
          args: --no-bundle

      # 绿色版 exe 在 bundle 之外，tauri-action 不会自动上传，这里手动补传。
      - name: Upload portable exe to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}"
          gh release upload "$TAG" src-tauri/target/release/disk-lens.exe --clobber
          echo "uploaded disk-lens.exe to release $TAG"
