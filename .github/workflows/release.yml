name: Release

# 触发方式：
#   1. 仓库 Actions 页面 -> 选 Release workflow -> Run workflow（手工触发，测试用，
#      无需任何 git tag；构建产物为绿色版可执行文件，放到 Draft release 附件里）
#   2. 推送形如 v0.1.0 的 git tag（正式发版，推荐）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: disk-lens.exe
            # Windows 保持绿色版 exe（不产出安装包）
            build_args: --no-bundle
            upload_paths: |
              src-tauri/target/release/disk-lens.exe
          # ubuntu-22.04 而非 ubuntu-latest：glibc 兼容性基准。
          # 在 24.04 上编出的二进制要求更高 glibc，Ubuntu 20.04 等旧系统
          # 会报 "GLIBC_2.33 not found"。22.04 自带 libwebkit2gtk-4.1-dev。
          - os: ubuntu-22.04
            artifact: disk-lens
            # 一次产出：绿色版二进制 + .deb（apt/dpkg 安装）+ .AppImage（单文件）
            build_args: --bundles deb,appimage
            upload_paths: |
              src-tauri/target/release/disk-lens
              src-tauri/target/release/bundle/
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 必须先于 setup-node 安装：setup-node 的 cache: pnpm 需要
      # 调用 pnpm 来定位 store 缓存，顺序反了会报 "Unable to locate pnpm"。
      # 版本不在此指定——pnpm/action-setup v4 会自动读取 package.json 的
      # packageManager 字段（同时指定 version 会报 "Multiple versions"）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # key 必须含 matrix.os：Swatinem/rust-cache 默认 key 只含 rustc 版本 +
      # Cargo.lock hash + target，同 target 的 ubuntu-latest(24.04) 和
      # ubuntu-22.04 会共享缓存 → 22.04 复用 24.04 编出的 glibc 2.39 产物，
      # 编译 glib 时报 "GLIBC_2.39 not found" / "can't find crate for glib"。
      # 加 key: ${{ matrix.os }} 后各 runner 独立缓存，互不复用。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        # 不用 --frozen-lockfile：pnpm 11 在 frozen 模式下只认 lockfile settings
        # 里的 onlyBuiltDependencies，读不到 pnpm-workspace.yaml 的批准记录，
        # 会误报 esbuild ignored-builds 并以非零退出（本地非 frozen 正常）。
        # lockfile 仍提交，版本锁定不变；build 批准走 workspace 配置。
        run: pnpm install

      # Windows：--no-bundle 只出绿色版 exe（保持现状）；
      # Linux：--bundles deb,appimage 一次产出绿色版 + .deb + .AppImage。
      # 注意不要写 `pnpm tauri build -- --bundles ...`：pnpm 会把 -- 后的参数
      # 原样透传，tauri CLI 再转发给 cargo build，导致 "unexpected argument"。
      # --bundles / --no-bundle 都是 tauri 顶层标志。
      - name: Build release (portable binary + bundles)
        run: pnpm tauri build ${{ matrix.build_args }}

      - name: Upload artifacts (portable binary + bundles)
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.os }}
          path: ${{ matrix.upload_paths }}
          if-no-files-found: error

  publish:
    name: Create draft release & upload
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create 需要 git 仓库上下文来解析 remote（否则报
      # "fatal: not a git repository"）；publish job 没有 build 的 checkout，
      # 所以这里单独 checkout 一次（轻量）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows portable binary
        uses: actions/download-artifact@v4
        with:
          name: portable-windows-latest
          path: dist-windows

      - name: Download Linux binary + bundles
        uses: actions/download-artifact@v4
        with:
          name: portable-ubuntu-22.04
          path: dist-linux

      # 手工创建 draft release 并上传所有产物。
      # 推 tag 时用 tag 名；手工触发时用 manual-<run_number>，不污染 tag 列表。
      - name: Create draft release & upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: |
            ## DiskLens ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}

            Windows / Linux 磁盘占用分析器。附件说明：

            - **`disk-lens.exe`** — Windows 绿色版（Windows 10/11 + WebView2 Runtime，Win11 自带）
            - **`disk-lens`** — Linux 绿色版（Ubuntu 22.04/24.04，需 WebKitGTK 运行库）
            - **`disk-lens_*.deb`** — Ubuntu/Debian 安装包（`sudo apt install ./disk-lens_*.deb`）
            - **`disk-lens_*.AppImage`** — Linux 单文件版（`chmod +x` 后直接运行）
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}"
          TITLE="DiskLens ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}"
          gh release create "$TAG" \
            dist-windows/disk-lens.exe \
            dist-linux/disk-lens \
            dist-linux/bundle/deb/*.deb \
            dist-linux/bundle/appimage/*.AppImage \
            --title "$TITLE" \
            --notes "$RELEASE_NOTES" \
            --draft
          echo "created release $TAG with all assets"
