# Custom permission for the app-level `scan_drive` command.
# Tauri cannot auto-generate a permission identifier from a snake_case command
# name (underscores are not allowed in identifiers), so we declare it explicitly
# and reference `allow-scan-drive` from capabilities/default.json.

[[permission]]
identifier = "allow-scan-drive"
description = "Allow the frontend to invoke the scan_drive command"
commands.allow = ["scan_drive"]

[[permission]]
identifier = "allow-get-node"
description = "Allow the frontend to invoke the get_node command"
commands.allow = ["get_node"]

[[permission]]
identifier = "allow-list-drives"
description = "Allow the frontend to invoke the list_drives command"
commands.allow = ["list_drives"]

[[permission]]
identifier = "allow-pick-folder"
description = "Allow the frontend to invoke the pick_folder command"
commands.allow = ["pick_folder"]

[[permission]]
identifier = "allow-cancel-scan"
description = "Allow the frontend to invoke the cancel_scan command"
commands.allow = ["cancel_scan"]

[[permission]]
identifier = "allow-export-scan-data"
description = "Allow the frontend to invoke the export_scan_data command"
commands.allow = ["export_scan_data"]
