[package]
name = "disk-lens"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["index-swf <index-swf@users.noreply.github.com>"]

[lib]
name = "disk_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 导出"适合人类阅读"的树状 YAML（serde_yaml 0.9 已 deprecated，用其社区 fork serde_yml）
serde_yml = "0.0"
# 导出文件时间戳 / exported_at 字段
chrono = "0.4"
thiserror = "2"
rayon = "1.10"
# 原生文件夹选择对话框（Windows IFileDialog / Linux GTK，供"自定义扫描路径"使用）
rfd = "0.15"

# Windows 专属：Win32 卷信息/盘符枚举/USN 等（仅 Windows 目标引入）
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
]

# Unix/Linux 专属：statvfs 卷信息等
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
