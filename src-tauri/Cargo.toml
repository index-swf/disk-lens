[package]
name = "disk-lens"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "disk_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
rayon = "1.10"
# 原生文件夹选择对话框（Windows IFileDialog，供"自定义扫描路径"使用）
rfd = "0.15"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_WindowsProgramming",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
